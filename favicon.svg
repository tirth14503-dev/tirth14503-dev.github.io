<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2a4a"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="100%" stop-color="#c4902a"/>
    </linearGradient>
  </defs>
  <!-- Dark navy rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Thin gold border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="none" stroke="url(#gold)" stroke-width="1"/>
  <!-- TK monogram -->
  <text x="16" y="22.5" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" text-anchor="middle" fill="url(#gold)" letter-spacing="-0.5">TK</text>
</svg>
